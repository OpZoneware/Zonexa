<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics · Zonexa</title>
<link rel="stylesheet" href="assets/zcc.css">
</head>
<body data-app="cc" data-page="analytics">
<main class="main">
  <section class="zcc-page-head">
    <div>
      <div class="zcc-eyebrow">Command Center · Analytics</div>
      <h1>Portfolio Analytics</h1>
      <p>Portfolio intelligence computed live from the shared project data.</p>
    </div>
    <span class="zcc-system-pill">Live Metrics</span>
  </section>
  <section class="section" id="analytics">
    <div class="metric-row" id="anMetrics" style="margin-bottom:14px"></div>
    <div class="an-grid">
      <div class="panel">
        <div class="section-head" style="margin-bottom:8px"><div><h2>Planned vs Actual Progress</h2><p>Latest reported position for each project.</p></div></div>
        <div id="anChart"></div>
      </div>
      <div class="panel" id="anStatus"></div>
    </div>
  </section>
</main>
<script src="assets/zcc-data.js"></script>
<script src="assets/zcc-app.js"></script>
</body>
</html>
